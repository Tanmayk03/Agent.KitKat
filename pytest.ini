[pytest]
testpaths = tests
python_files = test_stage*.py
asyncio_mode = auto
# Live checks (real Ollama, real job sites) only run when asked: pytest -m live
addopts = -m "not live"
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: needs network / Ollama (run explicitly with -m live)
